<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Mum — A Life in Pictures</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="stage">

  <div class="book" id="book">

    <!-- FRONT COVER -->
    <section class="cover" id="cover">
      <div class="cover-frame">
        <p class="cover-eyebrow">A collection of memories</p>
        <h1 class="cover-title">Happy Birthday,<br>Mum</h1>
        <div class="cover-clasp"></div>
        <button class="open-btn" id="openBtn" type="button">Open the album</button>
      </div>
      <div class="cover-spine"></div>
    </section>

    <!-- PAGES -->
    <section class="pages" id="pagesEl" hidden>
      <button class="edge edge-prev" id="prevBtn" aria-label="Previous photo">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="leaf" id="leaf">
        <div class="photo-mount">
          <img id="pageImg" src="" alt="">
        </div>
        <p class="caption" id="pageCaption"></p>
      </div>

      <button class="edge edge-next" id="nextBtn" aria-label="Next photo">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="folio" id="folio"></div>
      <button class="close-btn" id="closeBtn" type="button" aria-label="Close album">Close</button>
    </section>

    <!-- BACK COVER -->
    <section class="backcover" id="backCover" hidden>
      <div class="cover-frame">
        <p class="cover-eyebrow">With all our love</p>
        <h2 class="cover-title back-title">Happy Birthday</h2>
        <button class="open-btn" id="restartBtn" type="button">Back to the start</button>
      </div>
    </section>

  </div>

  <p class="hint" id="hint">Use the arrows, or swipe, to turn the pages</p>
</div>

<script src="script.js"></script>
</body>
</html>
